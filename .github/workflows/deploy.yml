name: Deploy

on:
  push:
    branches: [ "main" ]
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  GO_VERSION: "1.23"
  # Docker image name — change to your registry/repo
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ────────────────────────────────────────────────
  # Job 1: Run CI checks first
  # ────────────────────────────────────────────────
  ci-check:
    name: Quick CI Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build check
        run: CGO_ENABLED=0 go build --ldflags "-s -w" -o /tmp/goravel-blog .

  # ────────────────────────────────────────────────
  # Job 2: Build & push Docker image
  # ────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci-check
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── Login to GitHub Container Registry ──
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── (Optional) Login to Docker Hub ──
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v4
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ────────────────────────────────────────────────
  # Job 3: Deploy to server via SSH
  # ────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: docker
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ vars.APP_URL }}

    steps:
      - name: Checkout code (for scripts)
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/www/wwwroot/goravel-blog' }}"
            IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:latest"

            echo "==> Logging in to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            echo "==> Pulling latest image: ${IMAGE}"
            docker pull "${IMAGE}"

            echo "==> Stopping old container (if running)..."
            docker stop goravel-blog 2>/dev/null || true
            docker rm goravel-blog 2>/dev/null || true

            echo "==> Starting new container..."
            docker run -d \
              --name goravel-blog \
              --restart always \
              -p 3000:3000 \
              --env-file "${DEPLOY_PATH}/.env" \
              -v "${DEPLOY_PATH}/storage:/www/storage" \
              "${IMAGE}"

            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "==> Deployment complete!"
            docker ps --filter name=goravel-blog

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment succeeded!"
          else
            echo "❌ Deployment failed!"
          fi
